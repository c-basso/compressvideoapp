    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <title>{{meta.title}}</title>
    <meta
      name="description"
      content="{{meta.description}}"
    />
    {{#if meta.app_store_id}}
    <!-- App Store Smart App Banner -->
    <meta name="apple-itunes-app" content="app-id={{meta.app_store_id}}" />
    {{/if}}
    <!-- Core SEO -->
    <meta name="keywords" content="{{meta.keywords}}" />
    <meta name="author" content="{{meta.author}}" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <link rel="canonical" href="{{meta.canonical}}" />
    <link
      rel="alternate"
      type="text/plain"
      href="/llms.txt"
      title="LLM / AI summary of this site"
    />

    <!-- Alternate Language Links -->
    {{#each meta.alternate_languages as |lang|}}
    <link rel="alternate" hreflang="{{lang.lang}}" href="{{lang.url}}" />
    {{/each}}
    <link rel="alternate" hreflang="x-default" href="{{meta.alternate_default}}" />

    <!-- PWA & Theming -->
    <meta name="theme-color" content="{{meta.theme_color}}" />
    <meta name="msapplication-TileColor" content="{{meta.theme_color}}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="{{meta.apple_mobile_web_app_status_bar_style}}" />

    <!-- Open Graph -->
    <meta property="og:title" content="{{meta.og_title}}" />
    <meta property="og:description" content="{{meta.og_description}}" />
    <meta property="og:image" content="{{meta.og_image}}" />
    <meta property="og:image:alt" content="{{meta.og_image_alt}}" />
    <meta property="og:image:width" content="{{meta.og_image_width}}" />
    <meta property="og:image:height" content="{{meta.og_image_height}}" />
    <meta property="og:logo" content="{{meta.og_logo}}" />
    <meta property="og:type" content="{{meta.og_type}}" />
    <meta property="og:url" content="{{meta.og_url}}" />
    <meta property="og:site_name" content="{{header.app_name}}" />
    <meta property="og:locale" content="{{meta.og_locale}}" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="{{meta.twitter_card}}" />
    <meta name="twitter:url" content="{{meta.twitter_url}}" />
    <meta name="twitter:title" content="{{meta.twitter_title}}" />
    <meta name="twitter:description" content="{{meta.twitter_description}}" />
    <meta name="twitter:image" content="{{meta.twitter_image}}" />
    <meta name="twitter:image:width" content="{{meta.twitter_image_width}}" />
    <meta name="twitter:image:height" content="{{meta.twitter_image_height}}" />

    <link rel="preconnect" href="https://apps.apple.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://apps.apple.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/img/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/web-app-manifest-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/img/web-app-manifest-512x512.png" />
    <!-- Application Name -->
    <meta name="application-name" content="{{header.app_name}} – {{header.app_name_suffix}}" />

    <link
      rel="stylesheet"
      href="/style.css?v={{meta.version}}"
    />
    <script>document.documentElement.classList.add('js');</script>
    <!-- dev-links: on localhost / LAN dev servers, point absolute site links at the local copy (no effect in production) -->
    <script>
      (function () {
        var h = location.hostname;
        var isDev = h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h === '0.0.0.0' ||
          /\.(local|localhost|test)$/.test(h) || /^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(h);
        if (!isDev) return;
        var SITE = 'https://compressvideoapp.com';
        var sel = 'a[href^="' + SITE + '"]';
        function fix(root) {
          root.querySelectorAll(sel).forEach(function (a) {
            a.setAttribute('href', a.getAttribute('href').slice(SITE.length) || '/');
          });
        }
        document.addEventListener('DOMContentLoaded', function () { fix(document); });
        document.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest(sel);
          if (a) a.setAttribute('href', a.getAttribute('href').slice(SITE.length) || '/');
        }, true);
      })();
    </script>
